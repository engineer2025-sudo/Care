name: Web app checks

on:
  push:
    branches: ['arena/**', main]
    paths:
      - 'src/**'
      - 'test/**'
      - 'e2e/**'
      - 'e2e-offline/**'
      - 'playwright*.js'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.js'
      - 'tailwind.config.js'
      - 'postcss.config.js'
      - '.github/workflows/web.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'test/**'
      - 'e2e/**'
      - 'e2e-offline/**'
      - 'playwright*.js'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.js'
      - 'tailwind.config.js'
      - 'postcss.config.js'
      - '.github/workflows/web.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-audit:
    name: Test and build CareSphere web app
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Run local privacy and visit-prep tests
        run: npm test

      - name: Build production PWA
        run: npm run build

      - name: Audit dependency vulnerabilities
        run: npm audit --audit-level=moderate

      - name: Install browser
        run: npx playwright install --with-deps chromium

      - name: Accessible web interaction checks
        run: npm run test:ui

      - name: Offline production check
        run: npm run test:offline

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: web-test-reports
          path: test-results/
