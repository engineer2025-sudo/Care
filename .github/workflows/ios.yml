name: iOS Build

on:
  push:
    branches: [arena/01a0626b-care, main]
    paths: ['ios/**', '.github/workflows/ios.yml']
  pull_request:
    paths: ['ios/**', '.github/workflows/ios.yml']
  workflow_dispatch:

jobs:
  ios-build:
    name: Build CareSphere (SwiftUI · Swift · iOS)
    runs-on: macos-14
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Select newest installed Xcode
        run: |
          ls -d /Applications/Xcode*.app | sort -V
          LATEST_XCODE="$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          echo "Selecting $LATEST_XCODE"
          sudo xcode-select -s "$LATEST_XCODE"
          xcodebuild -version

      - name: Generate Xcode project
        run: cd ios && xcodegen generate

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcodebuild -showsdks | grep -i ios

      - name: Resolve packages
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild -resolvePackageDependencies \
            -project CareSphere.xcodeproj -scheme CareSphere 2>&1 | tee /tmp/spm.log | tail -20

      - name: Verify Jitsi/Giphy ABI-compatible package resolution
        run: |
          RESOLVED_FILE="$(find ios -name Package.resolved -print -quit)"
          if [[ -z "$RESOLVED_FILE" ]]; then
            echo "::error::SwiftPM did not write Package.resolved after dependency resolution"
            exit 1
          fi
          python3 - "$RESOLVED_FILE" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as package_file:
              resolved = json.load(package_file)
          versions = [
              pin["state"].get("version")
              for pin in resolved.get("pins", [])
              if pin.get("identity") == "giphy-ios-sdk"
          ]
          if versions != ["2.2.12"]:
              raise SystemExit(
                  f"Expected Jitsi-compatible Giphy 2.2.12, got {versions or 'no Giphy pin'}"
              )
          print("✅ JitsiMeetSDK resolves Giphy 2.2.12 (ABI-compatible)")
          PY

      - name: Build (compile check, unsigned iOS device target)
        run: |
          set -o pipefail
          xcodebuild \
            -project ios/CareSphere.xcodeproj \
            -scheme CareSphere \
            -destination 'generic/platform=iOS' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee /tmp/xcodebuild.log | tail -60

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: xcodebuild-log
          path: /tmp/*.log
          if-no-files-found: ignore

      - name: Surface errors as annotations
        if: failure()
        run: |
          grep -hE "\.swift:[0-9]+:[0-9]+: error:" /tmp/spm.log /tmp/xcodebuild.log 2>/dev/null | sort -u | head -25 | while IFS= read -r line; do
            echo "::error::${line:0:380}"
          done
          if [[ -s /tmp/xcodebuild.log ]]; then
            LOG_TAIL="$(tail -n 30 /tmp/xcodebuild.log | tr '\r' ' ' | sed -e 's/%/%25/g' -e 's/:/%3A/g' -e 's/,/%2C/g' | awk '{printf "%s%%0A", $0}')"
            echo "::error title=Xcodebuild log tail::${LOG_TAIL:0:6000}"
          fi
