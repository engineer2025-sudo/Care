name: iOS Build
on:
  push:
    branches: ['arena/**', main]
    paths: ['localization/**', 'scripts/generate_localizations.py', 'ios/**', '.github/workflows/ios.yml']
  pull_request:
    paths: ['localization/**', 'scripts/generate_localizations.py', 'ios/**', '.github/workflows/ios.yml']
  workflow_dispatch:
jobs:
  ios-build:
    name: Native iOS · no remote packages
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Check offline translation catalogs
        run: python3 scripts/generate_localizations.py --check
      - name: Select Xcode 26 for real Foundation Models compilation
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          test -n "$XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
      - name: Validate project and no remote dependencies
        run: python3 ios/scripts/check_project.py
      - name: Test activity logic
        run: |
          set -o pipefail
          swift test --package-path ios/ActivityKit 2>&1 | tee /tmp/activity-tests.log
      - name: Build physical iPhone target without signing
        run: |
          set -o pipefail
          xcodebuild -project ios/CareSphere.xcodeproj -scheme CareSphere -destination 'generic/platform=iOS' -derivedDataPath /tmp/device-build CODE_SIGNING_ALLOWED=NO build 2>&1 | tee /tmp/device.log | tail -60
      - name: Build optional HealthKit configuration
        run: |
          set -o pipefail
          xcodebuild -project ios/CareSphere.xcodeproj -scheme CareSphere-HealthKit -configuration Debug-HealthKit -destination 'generic/platform=iOS' -derivedDataPath /tmp/device-build CODE_SIGNING_ALLOWED=NO build 2>&1 | tee /tmp/healthkit.log | tail -40
      - name: Build and launch iPhone Simulator
        run: |
          set -o pipefail
          xcodebuild -project ios/CareSphere.xcodeproj -scheme CareSphere -destination 'generic/platform=iOS Simulator' -derivedDataPath /tmp/simulator-build CODE_SIGNING_ALLOWED=NO build 2>&1 | tee /tmp/simulator.log | tail -40
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for group in d["devices"].values() for x in group if "iPhone" in x["name"]))')
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl install "$DEVICE" /tmp/simulator-build/Build/Products/Debug-iphonesimulator/CareSphere.app
          xcrun simctl launch "$DEVICE" org.caresphere.CareSphere
          sleep 5
          xcrun simctl io "$DEVICE" screenshot /tmp/iphone-launch.png
      - name: Surface native compiler diagnostics
        if: failure()
        run: |
          for log in /tmp/device.log /tmp/healthkit.log /tmp/simulator.log; do
            if [ -f "$log" ]; then grep -E 'error:|warning:' "$log" | tail -80 | sed 's/^/::error::/' || true; fi
          done
      - name: Upload logs and launch screenshot
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-validation
          path: |
            /tmp/*.log
            /tmp/iphone-launch.png
