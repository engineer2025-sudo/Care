name: iOS & Mac Builds

on:
  push:
    branches: [arena/01a0626b-care, main]
    paths: ['ios/**', '.github/workflows/ios.yml']
  pull_request:
    paths: ['ios/**', '.github/workflows/ios.yml']
  workflow_dispatch:
    inputs:
      publish_mac_release:
        description: Build and publish a new versioned Mac release after confirming the matching app version and tag
        required: false
        type: boolean
        default: false
      release_tag:
        description: Release tag must exactly match the app's MARKETING_VERSION (for example mac-v2.2.0)
        required: false
        type: string
        default: ""

jobs:
  ios-build:
    name: Build CareSphere (SwiftUI · Swift · iOS)
    runs-on: macos-14
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Select newest installed Xcode
        run: |
          ls -d /Applications/Xcode*.app | sort -V
          LATEST_XCODE="$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          echo "Selecting $LATEST_XCODE"
          sudo xcode-select -s "$LATEST_XCODE"
          xcodebuild -version

      - name: Generate Xcode project
        run: cd ios && xcodegen generate

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcodebuild -showsdks | grep -i ios

      - name: Resolve packages
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild -resolvePackageDependencies \
            -project CareSphere.xcodeproj -scheme CareSphere 2>&1 | tee /tmp/spm.log | tail -20

      - name: Build (compile check, unsigned iOS device target)
        run: |
          set -o pipefail
          xcodebuild \
            -project ios/CareSphere.xcodeproj \
            -scheme CareSphere \
            -destination 'generic/platform=iOS' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee /tmp/xcodebuild.log | tail -60

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: /tmp/*.log
          if-no-files-found: ignore

      - name: Surface errors as annotations
        if: failure()
        run: |
          grep -hE "\.swift:[0-9]+:[0-9]+: error:" /tmp/spm.log /tmp/xcodebuild.log 2>/dev/null | sort -u | head -25 | while IFS= read -r line; do
            echo "::error::${line:0:380}"
          done
          if [[ -s /tmp/xcodebuild.log ]]; then
            LOG_TAIL="$(tail -n 30 /tmp/xcodebuild.log | tr '\r' ' ' | sed -e 's/%/%25/g' -e 's/:/%3A/g' -e 's/,/%2C/g' | awk '{printf "%s%%0A", $0}')"
            echo "::error title=Xcodebuild log tail::${LOG_TAIL:0:6000}"
          fi

  mac-build:
    name: Build CareSphere for Mac (.dmg)
    needs: ios-build
    runs-on: macos-14
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Select newest installed Xcode
        run: |
          LATEST_XCODE="$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          echo "Selecting $LATEST_XCODE"
          sudo xcode-select -s "$LATEST_XCODE"
          xcodebuild -version

      - name: Generate Xcode project
        run: cd ios && xcodegen generate

      - name: Read app version
        id: app-version
        run: |
          VERSION="$(sed -nE 's/^[[:space:]]*MARKETING_VERSION:[[:space:]]*"([^"]+)".*/\1/p' ios/project.yml | head -1)"
          if [[ -z "$VERSION" ]]; then
            echo "::error::Could not read MARKETING_VERSION from ios/project.yml"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building CareSphere $VERSION"

      - name: Build Mac app (Release, ad-hoc signed)
        run: |
          set -o pipefail
          xcodebuild \
            -project ios/CareSphere.xcodeproj \
            -scheme CareSphereMac \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            CODE_SIGN_IDENTITY="-" CODE_SIGNING_ALLOWED=YES \
            build 2>&1 | tee /tmp/mac.log | tail -40

      - name: Locate app bundle
        run: |
          APP_PATH="$(find ~/Library/Developer/Xcode/DerivedData -path '*Build/Products/Release*' -type d -name 'CareSphere.app' | head -1)"
          echo "Found: $APP_PATH"
          test -n "$APP_PATH"
          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"

      - name: Re-sign ad-hoc (no entitlements) and verify strictly
        run: |
          APP_PATH="$APP_PATH"
          echo "── Normalize bundled framework permissions before ad-hoc signing ──"
          chmod -R -N "$APP_PATH" || true
          chmod -R u+rwX,go+rX "$APP_PATH"
          echo "── Entitlements before (should be none/empty) ──"
          codesign -d --entitlements - "$APP_PATH" 2>&1 | head -3 || true
          codesign --remove-signature "$APP_PATH" 2>/dev/null || true
          codesign --force --deep --sign - "$APP_PATH"
          codesign --verify --deep --strict "$APP_PATH" && echo "✅ strict verify OK"
          echo "── Final signature ──"
          codesign -dv "$APP_PATH" 2>&1 | head -6
          echo "── Entitlements after (must be empty) ──"
          codesign -d --entitlements - "$APP_PATH" 2>&1 | head -3 || true
          # A restricted entitlement here would get the app SIGKILLed by
          # taskgated on user Macs ("Code Signature Invalid").
          if codesign -d --entitlements - "$APP_PATH" 2>/dev/null | grep -q "healthkit"; then
            echo "::error::Restricted entitlement present — ad-hoc app will be killed on user machines"
            exit 1
          fi

      - name: Check whether the optional Kokoro model is already released
        if: github.event_name != 'pull_request'
        id: kokoro-asset
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          ASSET_NAME="CareSphere-Kokoro-Int8-En-v0.19.zip"
          EXISTING_ASSETS="$(gh release view mac-v2.1.0 --repo "$REPO" --json assets --jq '.assets[].name' 2>/dev/null || true)"
          if printf '%s\n' "$EXISTING_ASSETS" | grep -Fxq "$ASSET_NAME"; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "Kokoro model asset already exists; keeping the versioned release asset."
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Package the optional Kokoro model release asset
        if: github.event_name != 'pull_request' && steps.kokoro-asset.outputs.present != 'true'
        run: |
          set -euo pipefail
          ARCHIVE="$RUNNER_TEMP/kokoro-int8-en-v0_19.tar.bz2"
          SOURCE_DIR="$RUNNER_TEMP/kokoro-source"
          BUNDLE_DIR="$RUNNER_TEMP/kokoro-bundle"
          SOURCE_URL="https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/kokoro-int8-en-v0_19.tar.bz2"
          SOURCE_SHA256="c9f0dd393615805b0bab050c340834d5e684e732aec91c0e860cd30e982c08bd"
          curl --fail --location --retry 4 --retry-all-errors --output "$ARCHIVE" "$SOURCE_URL"
          echo "$SOURCE_SHA256  $ARCHIVE" | shasum -a 256 --check -
          mkdir -p "$SOURCE_DIR" "$BUNDLE_DIR"
          tar -xjf "$ARCHIVE" -C "$SOURCE_DIR"

          MODEL_FILE="$(find "$SOURCE_DIR" -type f -name 'model.int8.onnx' -print -quit)"
          if [[ -z "$MODEL_FILE" ]]; then
            MODEL_FILE="$(find "$SOURCE_DIR" -type f -name 'model.onnx' -print -quit)"
          fi
          VOICES_FILE="$(find "$SOURCE_DIR" -type f -name 'voices.bin' -print -quit)"
          TOKENS_FILE="$(find "$SOURCE_DIR" -type f -name 'tokens.txt' -print -quit)"
          LICENSE_FILE="$(find "$SOURCE_DIR" -type f -iname 'LICENSE' -print -quit)"
          ESPEAK_DIR="$(find "$SOURCE_DIR" -type d -name 'espeak-ng-data' -print -quit)"
          test -n "$MODEL_FILE" && test -n "$VOICES_FILE" && test -n "$TOKENS_FILE"
          test -n "$LICENSE_FILE" && test -n "$ESPEAK_DIR"
          test "$(stat -f '%z' "$MODEL_FILE")" -gt 50000000

          mkdir -p "$BUNDLE_DIR/espeak-ng-data"
          cp "$MODEL_FILE" "$BUNDLE_DIR/model.onnx"
          cp "$VOICES_FILE" "$TOKENS_FILE" "$LICENSE_FILE" "$BUNDLE_DIR/"
          cp -R "$ESPEAK_DIR/." "$BUNDLE_DIR/espeak-ng-data/"
          curl --fail --location --retry 4 --retry-all-errors --output "$BUNDLE_DIR/ESPEAK-NG-COPYING" "https://raw.githubusercontent.com/espeak-ng/espeak-ng/1.52.0/COPYING"
          grep -q "GNU GENERAL PUBLIC LICENSE" "$BUNDLE_DIR/ESPEAK-NG-COPYING"
          README_FILE="$(find "$SOURCE_DIR" -type f -name 'README.md' -print -quit)"
          if [[ -n "$README_FILE" ]]; then
            cp "$README_FILE" "$BUNDLE_DIR/UPSTREAM-README.md"
          fi
          cat > "$BUNDLE_DIR/SOURCE.txt" <<'EOF'
          Kokoro int8 English v0.19 model and voices: Apache-2.0 (upstream LICENSE included).
          eSpeak-NG data is used for text pronunciation; its GPL-3.0 license is included as ESPEAK-NG-COPYING.
          Upstream model archive: https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/kokoro-int8-en-v0_19.tar.bz2
          Upstream archive SHA-256: c9f0dd393615805b0bab050c340834d5e684e732aec91c0e860cd30e982c08bd
          eSpeak-NG license source: https://github.com/espeak-ng/espeak-ng/blob/1.52.0/COPYING
          Sherpa-ONNX runtime: Apache-2.0, https://github.com/k2-fsa/sherpa-onnx
          EOF

          cd "$BUNDLE_DIR"
          zip -0 -q -r "$GITHUB_WORKSPACE/CareSphere-Kokoro-Int8-En-v0.19.zip" .
          unzip -tq "$GITHUB_WORKSPACE/CareSphere-Kokoro-Int8-En-v0.19.zip"
          cd "$GITHUB_WORKSPACE"
          shasum -a 256 CareSphere-Kokoro-Int8-En-v0.19.zip > CareSphere-Kokoro-Int8-En-v0.19.zip.sha256
          ls -lh CareSphere-Kokoro-Int8-En-v0.19.zip CareSphere-Kokoro-Int8-En-v0.19.zip.sha256

      - name: Package DMG + ZIP
        env:
          APP_VERSION: ${{ steps.app-version.outputs.version }}
        run: |
          set -Eeuo pipefail
          exec > >(tee /tmp/package.log) 2>&1
          mkdir -p staging
          # Keep the signed bundle metadata intact while omitting restrictive
          # ACLs that prevent hdiutil from reading the ONNX framework.
          ditto --noacl "$APP_PATH" staging/CareSphere.app
          test -d staging/CareSphere.app
          ls -la staging/CareSphere.app/Contents/Frameworks/onnxruntime.framework/Versions/A || true
          ln -s /Applications staging/Applications
          cat > staging/README-FIRST.txt <<'EOF'
          ⚠️  FIRST LAUNCH ON macOS — one-time, 20 seconds:
          1. Drag CareSphere into Applications, then open it once (a warning appears — click Done).
          2. System Settings -> Privacy & Security -> scroll down -> "Open Anyway" -> Open.
          This app is ad-hoc signed (no paid Apple certificate), so Gatekeeper asks once.
          The build is verified in CI: signature, bundle integrity and a live launch test.
          Optional local models and reference libraries are not bundled in the installer. Check the in-app descriptions for download sizes, licensing and storage requirements.
          EOF
          hdiutil create -volname "CareSphere" \
            -srcfolder staging \
            -ov -format UDZO \
            "CareSphere-${APP_VERSION}-mac.dmg"
          # Mac-native zip (preserves metadata/resource forks) as an
          # alternative download format.
          ditto -c -k --keepParent --sequesterRsrc "$APP_PATH" "CareSphere-${APP_VERSION}-mac.zip"
          shasum -a 256 "CareSphere-${APP_VERSION}-mac.dmg" "CareSphere-${APP_VERSION}-mac.zip" > "CareSphere-${APP_VERSION}-mac.sha256"
          ls -lh "CareSphere-${APP_VERSION}-mac.dmg" "CareSphere-${APP_VERSION}-mac.zip" "CareSphere-${APP_VERSION}-mac.sha256"

      - name: Verify integrity & smoke-test launch
        env:
          APP_VERSION: ${{ steps.app-version.outputs.version }}
        run: |
          hdiutil attach "CareSphere-${APP_VERSION}-mac.dmg" -mountpoint /tmp/caremount -nobrowse
          APP="/tmp/caremount/CareSphere.app"
          echo "── Bundle contents ──"
          ls -la "$APP/Contents/MacOS/"
          file "$APP/Contents/MacOS/CareSphere"
          echo "── Code signature (ad-hoc expected) ──"
          codesign -dv "$APP" 2>&1 | head -6
          codesign --verify --deep "$APP" && echo "✅ codesign verify: OK"
          echo "── Launch smoke test (informational; GUI apps can be limited on CI VMs) ──"
          nohup "$APP/Contents/MacOS/CareSphere" >/tmp/app-run.log 2>&1 < /dev/null &
          APP_PID=$!
          sleep 5
          if kill -0 "$APP_PID" 2>/dev/null; then
            echo "✅ App launched and stayed running — bundle is healthy"
          else
            echo "::warning::App process exited on the headless CI VM — verify manually on a real Mac (GUI session limitation is common and benign)."
          fi
          pkill -f "CareSphere.app/Contents/MacOS" 2>/dev/null || true
          sleep 2
          # The smoke-launched app can hold the mount busy — force-detach, non-fatal.
          hdiutil detach /tmp/caremount -force 2>/dev/null || true
          echo "── SHA-256 checksums ──"
          shasum -a 256 "CareSphere-${APP_VERSION}-mac.dmg" "CareSphere-${APP_VERSION}-mac.zip"

      - name: Upload installers as workflow artifacts too
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mac-installers
          path: |
            CareSphere-${{ steps.app-version.outputs.version }}-mac.dmg
            CareSphere-${{ steps.app-version.outputs.version }}-mac.zip
            CareSphere-${{ steps.app-version.outputs.version }}-mac.sha256
            CareSphere-Kokoro-Int8-En-v0.19.zip
            CareSphere-Kokoro-Int8-En-v0.19.zip.sha256
          if-no-files-found: ignore

      - name: Upload mac build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mac-build-log
          path: |
            /tmp/mac.log
            /tmp/package.log
          if-no-files-found: ignore

      - name: Surface mac errors as annotations
        if: failure()
        run: |
          grep -hE "\.swift:[0-9]+:[0-9]+: error:" /tmp/mac.log 2>/dev/null | sort -u | head -25 | while IFS= read -r line; do
            echo "::error::${line:0:380}"
          done
          if [[ -s /tmp/package.log ]]; then
            LOG_TAIL="$(tail -n 35 /tmp/package.log | tr '\r' ' ' | sed -e 's/%/%25/g' -e 's/:/%3A/g' -e 's/,/%2C/g' | awk '{printf "%s%%0A", $0}')"
            echo "::error title=DMG packaging log tail::${LOG_TAIL:0:6000}"
          fi

  # Keep the write-capable token away from ordinary build jobs. Publication is
  # opt-in, version-checked, checksum-verified and refuses all existing tags.
  mac-publish:
    name: Publish a new version-matched Mac release
    if: github.event_name == 'workflow_dispatch' && inputs.publish_mac_release == true
    needs: mac-build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Read app version
        id: app-version
        run: |
          VERSION="$(sed -nE 's/^[[:space:]]*MARKETING_VERSION:[[:space:]]*"([^"]+)".*/\1/p' ios/project.yml | head -1)"
          if [[ -z "$VERSION" ]]; then
            echo "::error::Could not read MARKETING_VERSION from ios/project.yml"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Download verified Mac build artifacts
        uses: actions/download-artifact@v4
        with:
          name: mac-installers
          path: mac-installers

      - name: Validate version, release notes, and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          APP_VERSION: ${{ steps.app-version.outputs.version }}
          REQUESTED_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          EXPECTED_TAG="mac-v${APP_VERSION}"
          if [[ "$REQUESTED_TAG" != "$EXPECTED_TAG" ]]; then
            echo "::error::Requested tag '$REQUESTED_TAG' must exactly match '$EXPECTED_TAG'."
            exit 1
          fi
          NOTES_FILE="release-notes/${APP_VERSION}.md"
          if [[ ! -s "$NOTES_FILE" ]]; then
            echo "::error::Add reviewed, version-specific release notes at $NOTES_FILE before publishing."
            exit 1
          fi
          REMOTE_TAG="$(git ls-remote origin "refs/tags/${REQUESTED_TAG}" "refs/tags/${REQUESTED_TAG}^{}")" || {
            echo "::error::Could not verify the remote tag state. Refusing to publish."
            exit 1
          }
          if [[ -n "$REMOTE_TAG" ]]; then
            echo "::error::Tag $REQUESTED_TAG already exists. Refusing to reuse or move a version tag."
            exit 1
          fi
          if gh release view "$REQUESTED_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release $REQUESTED_TAG already exists. Existing releases are immutable from this workflow."
            exit 1
          fi

          APP_DMG="mac-installers/CareSphere-${APP_VERSION}-mac.dmg"
          APP_ZIP="mac-installers/CareSphere-${APP_VERSION}-mac.zip"
          APP_SHA="CareSphere-${APP_VERSION}-mac.sha256"
          test -s "$APP_DMG" && test -s "$APP_ZIP" && test -s "mac-installers/$APP_SHA"
          (cd mac-installers && sha256sum --check "$APP_SHA")

          ASSETS=("$APP_DMG" "$APP_ZIP" "mac-installers/$APP_SHA")
          KOKORO="mac-installers/CareSphere-Kokoro-Int8-En-v0.19.zip"
          KOKORO_SHA="${KOKORO}.sha256"
          if [[ -s "$KOKORO" ]]; then
            if [[ ! -s "$KOKORO_SHA" ]]; then
              echo "::error::Kokoro archive exists without its checksum file."
              exit 1
            fi
            (cd mac-installers && sha256sum --check "$(basename "$KOKORO_SHA")")
            ASSETS+=("$KOKORO" "$KOKORO_SHA")
          fi

          gh release create "$REQUESTED_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "CareSphere for Mac ${APP_VERSION}" \
            --draft \
            --notes-file "$NOTES_FILE"

          TAG_REF="refs/tags/${REQUESTED_TAG}"
          CREATED_TAG_STATE="$(git ls-remote origin "$TAG_REF" "${TAG_REF}^{}")" || {
            echo "::error::Could not verify the newly created tag. Leaving the release unpublished."
            exit 1
          }
          CREATED_TAG_COMMIT="$(printf '%s\\n' "$CREATED_TAG_STATE" | awk -v tag="$TAG_REF" '$2 == tag "^{}" { peeled = $1 } $2 == tag { direct = $1 } END { if (peeled != "") print peeled; else print direct }')"
          if [[ "$CREATED_TAG_COMMIT" != "$GITHUB_SHA" ]]; then
            echo "::error::New tag resolves to '$CREATED_TAG_COMMIT', not this verified build '$GITHUB_SHA'. Leaving the release unpublished."
            exit 1
          fi

          gh release upload "$REQUESTED_TAG" "${ASSETS[@]}" --repo "$GITHUB_REPOSITORY"
          gh release edit "$REQUESTED_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
          echo "✅ Release published: https://github.com/$GITHUB_REPOSITORY/releases/tag/$REQUESTED_TAG"
