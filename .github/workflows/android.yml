name: Android Build
on:
  push:
    branches: ['arena/**', main]
    paths: ['android/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Use preinstalled Android SDK
        run: |
          test -d "$ANDROID_HOME"
          echo "SDK: $ANDROID_HOME"
          ls "$ANDROID_HOME/platforms"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build APK, test rules and lint
        working-directory: android
        run: |
          set -o pipefail
          ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug 2>&1 | tee /tmp/android-build.log
      - name: Surface compiler and lint errors
        if: failure()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('/tmp/android-build.log')
          if p.exists():
              tail = '\n'.join(p.read_text().splitlines()[-120:])[-50000:]
              print('::error::' + tail.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A'))
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: CareSphere-Android
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/reports/
            android/app/build/test-results/
