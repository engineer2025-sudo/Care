name: CareSphere
options:
  bundleIdPrefix: org.caresphere
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

packages:
  JitsiMeetSDK:
    url: https://github.com/jitsi/jitsi-meet-ios-sdk-releases
    from: 13.1.1

settings:
  base:
    SWIFT_VERSION: "5.9"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""

targets:
  CareSphere:
    type: application
    platform: iOS
    sources:
      - path: CareSphere
    dependencies:
      - package: JitsiMeetSDK
    entitlements:
      path: CareSphere.entitlements
      properties:
        com.apple.developer.healthkit: true
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: CareSphere
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
        UIViewControllerBasedStatusBarAppearance: false
        UIBackgroundModes:
          - audio
          - voip
        NSCameraUsageDescription: "CareSphere uses the camera for video coffee circles and telehealth visits."
        NSMicrophoneUsageDescription: "CareSphere uses the microphone for video coffee circles and telehealth visits."
        NSHealthShareUsageDescription: "CareSphere reads your heart rate, blood oxygen and blood pressure from Apple Health so you and your care circle can spot trends early."
        NSHealthUpdateUsageDescription: "CareSphere can save vitals you record in the app to Apple Health."
        NSBluetoothAlwaysUsageDescription: "CareSphere connects to Bluetooth heart-rate monitors and pulse oximeters to stream live vitals."
        NSLocationWhenInUseUsageDescription: "CareSphere attaches your location to an emergency SOS alert so responders and family can find you."

schemes:
  CareSphere:
    build:
      targets:
        CareSphere: all
    run:
      config: Debug
