name: CareSphere
options:
  bundleIdPrefix: org.caresphere
  createIntermediateGroups: true

packages:
  CareActivityKit:
    path: ActivityKit

configs:
  Debug: debug
  Release: release
  Debug-HealthKit: debug

settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "3.6.1"
    CURRENT_PROJECT_VERSION: "15"
    DEVELOPMENT_TEAM: ""
    SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"

targets:
  # ── iPhone / iPad app ────────────────────────────────────────────────
  CareSphere:
    type: application
    platform: iOS
    deploymentTarget:
      iOS: "16.0"
    sources:
      - path: CareSphere
    dependencies:
      - package: CareActivityKit
    settings:
      configs:
        Debug-HealthKit:
          CODE_SIGN_ENTITLEMENTS: CareSphere-HealthKit.entitlements
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) CARE_HEALTHKIT"
    entitlements:
      path: CareSphere.entitlements
      properties: {}
    info:
      path: CareSphere-iOS-Info.plist
      properties:
        CFBundleDisplayName: CareSphere
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # Reconfirm this declaration with Apple's export-compliance questionnaire after the CryptoKit AES-GCM change.
        ITSAppUsesNonExemptEncryption: false
        UIViewControllerBasedStatusBarAppearance: false
        NSFaceIDUsageDescription: "CareSphere locks your health data behind Touch ID / Face ID."
        NSMotionUsageDescription: "CareSphere counts your daily steps to encourage gentle, healthy movement."
        NSCameraUsageDescription: "CareSphere uses the camera for video coffee circles and telehealth visits."
        NSMicrophoneUsageDescription: "CareSphere uses the microphone for video coffee circles and telehealth visits."
        NSHealthShareUsageDescription: "CareSphere reads heart rate, blood oxygen, blood pressure, and workout summaries from Apple Health after you approve. It never writes health data."
        NSBluetoothAlwaysUsageDescription: "CareSphere connects to Bluetooth heart-rate monitors — including Garmin watches broadcasting heart rate — to stream live vitals."
        NSLocationWhenInUseUsageDescription: "CareSphere includes your location only when you choose to share SOS details. Nothing is sent automatically."
        NSBonjourServices: ["_care-xfer._tcp"]
        NSLocalNetworkUsageDescription: "CareSphere transfers selected encrypted records directly between nearby phones on your private Wi-Fi or hotspot, and can search a local Kiwix library."
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true

schemes:
  CareSphere:
    build:
      targets:
        CareSphere: all
    run:
      config: Debug
  CareSphere-HealthKit:
    build:
      targets:
        CareSphere: all
    run:
      config: Debug-HealthKit
