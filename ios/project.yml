name: CareSphere
options:
  bundleIdPrefix: org.caresphere
  createIntermediateGroups: true

packages:
  JitsiMeetSDK:
    url: https://github.com/jitsi/jitsi-meet-ios-sdk-releases
    from: 13.1.1
  LlamaSwift:
    url: https://github.com/mattt/llama.swift
    from: 2.10549.0
  SherpaOnnx:
    url: https://github.com/k2-fsa/sherpa-onnx.git
    from: 1.13.8
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation.git
    from: 0.9.20

settings:
  base:
    SWIFT_VERSION: "5.9"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "2.1.0"
    CURRENT_PROJECT_VERSION: "3"
    DEVELOPMENT_TEAM: ""

targets:
  # ── iPhone / iPad app ────────────────────────────────────────────────
  CareSphere:
    type: application
    platform: iOS
    deploymentTarget:
      iOS: "16.0"
    sources:
      - path: CareSphere
    dependencies:
      - package: JitsiMeetSDK
      - package: LlamaSwift
        product: LlamaSwift
      - package: SherpaOnnx
        product: sherpa-onnx
      - package: ZIPFoundation
    entitlements:
      path: CareSphere.entitlements
      properties:
        com.apple.developer.healthkit: true
    info:
      path: CareSphere-iOS-Info.plist
      properties:
        CFBundleDisplayName: CareSphere
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
        UIViewControllerBasedStatusBarAppearance: false
        UIBackgroundModes:
          - audio
          - voip
        NSFaceIDUsageDescription: "CareSphere locks your health data behind Touch ID / Face ID."
        NSMotionUsageDescription: "CareSphere counts your daily steps to encourage gentle, healthy movement."
        NSCameraUsageDescription: "CareSphere uses the camera for video coffee circles and telehealth visits."
        NSMicrophoneUsageDescription: "CareSphere uses the microphone for video coffee circles and telehealth visits."
        NSHealthShareUsageDescription: "CareSphere reads your heart rate, blood oxygen and blood pressure from Apple Health so you and your care circle can spot trends early."
        NSHealthUpdateUsageDescription: "CareSphere can save vitals you record in the app to Apple Health."
        NSBluetoothAlwaysUsageDescription: "CareSphere connects to Bluetooth heart-rate monitors — including Garmin watches broadcasting heart rate — to stream live vitals."
        NSLocationWhenInUseUsageDescription: "CareSphere attaches your location to an emergency SOS alert so responders and family can find you."
        NSLocalNetworkUsageDescription: "CareSphere searches a Kiwix offline library only on your private local network."
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true

  # ── Native Mac app (ships as .dmg) ──────────────────────────────────
  # NOTE: no entitlements on purpose — restricted entitlements (e.g. HealthKit)
  # cannot be ad-hoc signed; taskgated kills the app with "Invalid Signature".
  # Garmin/BLE via CoreBluetooth needs no entitlement.
  CareSphereMac:
    type: application
    platform: macOS
    deploymentTarget:
      macOS: "13.0"
    sources:
      - path: CareSphere
    dependencies:
      - package: LlamaSwift
        product: LlamaSwift
      - package: SherpaOnnx
        product: sherpa-onnx
      - package: ZIPFoundation
    settings:
      base:
        PRODUCT_NAME: CareSphere
        PRODUCT_BUNDLE_IDENTIFIER: org.caresphere.CareSphereMac
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_ENTITLEMENTS: ""
    info:
      path: CareSphere-Mac-Info.plist
      properties:
        CFBundleDisplayName: CareSphere
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSApplicationCategoryType: public.app-category.healthcare-fitness
        LSMinimumSystemVersion: "13.0"
        NSHighResolutionCapable: true
        ITSAppUsesNonExemptEncryption: false
        NSHealthShareUsageDescription: "CareSphere reads heart rate and blood pressure from Apple Health so you and your care circle can spot trends early."
        NSHealthUpdateUsageDescription: "CareSphere can save vitals you record in the app to Apple Health."
        NSBluetoothAlwaysUsageDescription: "CareSphere connects to Bluetooth heart-rate monitors — including Garmin watches broadcasting heart rate — to stream live vitals."
        NSLocationWhenInUseUsageDescription: "CareSphere attaches your location to an emergency SOS alert so responders and family can find you."
        NSLocalNetworkUsageDescription: "CareSphere searches a Kiwix offline library only on your private local network."
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true

schemes:
  CareSphere:
    build:
      targets:
        CareSphere: all
    run:
      config: Debug
  CareSphereMac:
    build:
      targets:
        CareSphereMac: all
    run:
      config: Release
